<!doctype html><html lang="ja"><head><link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>実景放流AR | DAM MISSION SHIONOE</title>  <script type="module" crossorigin src="./assets/landscape-BZIjHYIG.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/ar-controller-DDlqlueF.js">
  <link rel="stylesheet" crossorigin href="./assets/landscape-DJ0ObCbS.css">
</head><body>
<main class="field">
<header><a href="./">‹ ダムの調査に戻る</a><span>DAM MISSION SHIONOE</span></header>
<h1>実景放流AR</h1>
<p>堤体の開口部から噴き出す水の勢いを変えてみましょう。</p>
<div class="view-picker">
  <label for="view-picker">確認する角度</label>
  <select id="view-picker">
    <option value="front">正面寄り</option>
    <option value="oblique">斜めから</option>
  </select>
  <button id="guide-toggle" type="button" aria-controls="dam-guide guide-anchors" aria-pressed="true">AR解説</button>
</div>
<div class="stage" id="stage"><img id="photo" src="./landscape/dam.jpg" alt="下流側から見上げたダム。開口部から右下に水路が延びる。"><canvas id="water" aria-label="開口部から斜面に沿って流れる模式的な放流水"></canvas><span id="mode">写真で体験</span><div id="guide-anchors"></div></div>
<button id="camera" class="field-camera">カメラで景色に重ねる</button>
<p id="status" role="status">現地では安全な見学場所に立ち止まり、カメラを写真と同じ向きに合わせてください。</p>
<section id="dam-guide" class="dam-guide" aria-label="椛川ダムの見どころ">
  <nav id="guide-topics" class="guide-topics" aria-label="解説を選ぶ"></nav>
  <div class="guide-card" aria-live="polite">
    <div class="guide-intro">
      <h2 id="guide-title"></h2>
      <p id="guide-body"></p>
    </div>
    <div class="guide-fact">
      <p id="guide-metric"></p>
      <p id="guide-caption"></p>
      <a id="guide-source" target="_blank" rel="noopener noreferrer">香川県の資料 ↗</a>
    </div>
  </div>
</section>
<div class="controls"><div class="level"><label for="strength">仮想の放流の強さ</label><output id="reading" for="strength">85%</output></div>
<input id="strength" type="range" min="0" max="100" value="85" step="1">
<div class="actions"><button id="pause">一時停止</button><button id="surge">放流の波を送る</button></div></div>
<p class="note">教育用の仮想放流です。強さは演出用の相対値です。実際の設備操作・水位予測・避難判断には使用できません。豪雨・警報時は屋外での体験を中止してください。</p>
</main></body></html>
