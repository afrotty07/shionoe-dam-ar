</head><body>
<main class="field">
<header><a href="./">‹ ダムの調査に戻る</a><span>DAM MISSION SHIONOE</span></header>
<h1>実景放流AR</h1>
<p>写真中央より少し右の開口部に注目して、放流の強さを変えてみましょう。</p>
<div class="stage" id="stage"><img id="photo" src="./landscape/dam.jpg" alt="下流側から見上げたダム。開口部から右下に水路が延びる。"><canvas id="water" aria-label="開口部から斜面に沿って流れる模式的な放流水"></canvas><span id="mode">写真で体験</span></div>
<div class="controls"><div class="level"><label for="strength">仮想の放流の強さ</label><output id="reading" for="strength">85%</output></div>
<input id="strength" type="range" min="0" max="100" value="85" step="1">
<div class="actions"><button id="pause">一時停止</button><button id="surge">放流の波を送る</button><button id="camera">カメラで景色に重ねる</button></div></div>
<p id="status" role="status">現地では安全な見学場所に立ち止まり、カメラを写真と同じ向きに合わせてください。</p>
<p class="note">教育用の仮想放流です。強さは演出用の相対値です。実際の設備操作・水位予測・避難判断には使用できません。豪雨・警報時は屋外での体験を中止してください。</p>
</main></body></html>
